# Starts the complete SyncSphere development environment:
#   postgres  - the database (data kept in the named volume "postgres-data")
#   redis     - Pub/Sub between app instances + shared presence (no persistence needed)
#   app-1     - SyncSphere instance 1 -> http://localhost:8080
#   app-2     - SyncSphere instance 2 -> http://localhost:8081  (same image, same DB and Redis)
#
# Start everything:   docker compose up --build
#
# Inside the Compose network, containers reach each other by SERVICE NAME (postgres, redis),
# never by "localhost" (inside a container, localhost is the container itself).
#
# Every ${VAR:-default} can be overridden in a .env file next to this file (see .env.example).
# The defaults are for local development only.

name: syncsphere

# Settings shared by both application instances (YAML anchor, merged with "<<: *app").
x-app: &app
  build: .
  image: syncsphere-app:local
  restart: unless-stopped
  depends_on:
    # Do not start the app until both dependencies report healthy.
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
  healthcheck:
    # "readiness" is UP only when the app can reach PostgreSQL and Redis.
    test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/actuator/health/readiness"]
    interval: 10s
    timeout: 3s
    retries: 6
    start_period: 40s

x-app-environment: &app-environment
  DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-syncsphere}
  DB_USERNAME: ${POSTGRES_USER:-syncsphere}
  DB_PASSWORD: ${POSTGRES_PASSWORD:-syncsphere_dev_password}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  SYNCSPHERE_ALLOWED_ORIGINS: ${SYNCSPHERE_ALLOWED_ORIGINS:-http://localhost:*,http://127.0.0.1:*}

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-syncsphere}
      POSTGRES_USER: ${POSTGRES_USER:-syncsphere}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-syncsphere_dev_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      # Published on 127.0.0.1 only, so it is reachable from this machine (psql, ./mvnw spring-boot:run)
      # but not from the network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # Pub/Sub messages and presence are temporary by design, so persistence is switched off.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  app-1:
    <<: *app
    environment:
      <<: *app-environment
      SYNCSPHERE_INSTANCE_ID: app-1
    ports:
      - "${APP1_PORT:-8080}:8080"

  app-2:
    <<: *app
    environment:
      <<: *app-environment
      SYNCSPHERE_INSTANCE_ID: app-2
    ports:
      - "${APP2_PORT:-8081}:8080"

volumes:
  postgres-data:
